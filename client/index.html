<title>Warzone 1989</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*__CSS__*/
</style>


<div id="app">
  <header id="bar">
    <div class="brand" aria-label="Warzone 1989"><span class="w">WARZONE</span><span class="y">1989</span></div>
    <div class="readouts">
      <div class="ro res"><span class="k">Gasolio</span><span class="v" id="roRes">600</span></div>
      <div class="ro"><span class="k">Pompe</span><span class="v" id="roPumps">0</span></div>
      <div class="ro"><span class="k">Mezzi</span><span class="v" id="roUnits">0</span></div>
      <div class="ro"><span class="k">Tempo</span><span class="v" id="roTime">00:00</span></div>
    </div>
    <div class="barbtns">
      <button class="btn" id="btnSound" aria-pressed="true" title="Suono">Suono</button>
      <button class="btn" id="btnSpeed" title="Velocità di gioco">1×</button>
      <button class="btn" id="btnPause">Pausa</button>
      <button class="btn" id="btnHelp">Comandi</button>
      <button class="btn" id="btnExit" title="Esci dalla partita e torna al menu">Menu</button>
    </div>
  </header>
  <div id="body">
    <main id="stage">
      <canvas id="view" aria-label="Mappa tattica"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="objective" hidden role="status" aria-live="polite">
        <div class="oh"><span class="ok" id="objKind">Obiettivo</span><span class="ot" id="objText"></span></div>
        <div class="obar"><i id="objBar"></i></div>
      </div>
      <div id="touchbar" role="toolbar" aria-label="Ordini rapidi">
        <button class="btn" id="btnAmove" aria-label="Attacca-muovi" title="Attacca-muovi (A)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4"/></svg><span>Attacca</span></button>
        <button class="btn" id="btnStop" aria-label="Ferma" title="Ferma (S)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="9" height="9" class="fill"/></svg><span>Ferma</span></button>
        <button class="btn" id="btnDesel" aria-label="Deseleziona" title="Deseleziona (Esc)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="2" y="2" width="12" height="12" stroke-dasharray="2.4 1.6"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"/></svg><span>Nessuno</span></button>
        <button class="btn" id="btnArmy" aria-label="Tutto l’esercito" title="Tutto l’esercito: seleziona tutti i mezzi armati"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 6.5 8 3l5 3.5M3 10 8 6.5l5 3.5M3 13.5 8 10l5 3.5"/></svg><span>Esercito</span></button>
        <button class="btn hero" id="btnHero" hidden aria-label="Macchina di Villo: seleziona e porta lì la visuale" title="Macchina di Villo: seleziona e porta lì la visuale (V)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1.5 10.5V8.3l2-.6 1.6-2.9h5l2 2.9 2.4.7v2.1"/><path d="M5.2 7.6h5.6"/><circle cx="4.6" cy="10.8" r="1.5"/><circle cx="11.4" cy="10.8" r="1.5"/><path d="M6.1 10.8h3.8"/></svg><span>Villo</span></button>
        <button class="btn alarm" id="btnAlarm" aria-label="Allarme: vai all’ultimo scontro" title="Allarme: vai all’ultimo scontro (toccalo di nuovo per i precedenti)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 1.8 14.6 13.6H1.4Z"/><path d="M8 6v3.6"/><circle cx="8" cy="11.5" r="0.6" class="fill"/></svg><span>Allarme</span><i class="bdg"></i></button>
        <span class="tbsel zero" id="selCount" role="status" aria-label="0 mezzi selezionati"><b>0</b><small>sel.</small><i class="shp" aria-hidden="true"><i data-hp="all"></i></i></span>
        <button class="btn sq" data-squad="1" aria-label="Squadra 1: vuota" title="Squadra 1: tocco seleziona, doppio tocco va lì, tieni premuto per salvare la selezione"><b>1</b><small>–</small></button>
        <button class="btn sq" data-squad="2" aria-label="Squadra 2: vuota" title="Squadra 2: tocco seleziona, doppio tocco va lì, tieni premuto per salvare la selezione"><b>2</b><small>–</small></button>
        <button class="btn sq" data-squad="3" aria-label="Squadra 3: vuota" title="Squadra 3: tocco seleziona, doppio tocco va lì, tieni premuto per salvare la selezione"><b>3</b><small>–</small></button>
        <button class="btn sq" data-squad="4" aria-label="Squadra 4: vuota" title="Squadra 4: tocco seleziona, doppio tocco va lì, tieni premuto per salvare la selezione"><b>4</b><small>–</small></button>
      </div>
      <div id="placebar" hidden>
        <div class="pbinfo" id="pbInfo" role="status" aria-live="polite"></div>
        <button class="pbx" id="btnPlaceNo" aria-label="Annulla il piazzamento" title="Annulla"></button>
        <button class="pbok" id="btnPlaceOk" aria-label="Conferma: costruisci qui" title="Costruisci qui"></button>
      </div>
      <div id="arrows"></div>
      <div id="toasts" aria-live="polite"></div>
    </main>
    <aside id="panel">
      <div class="mm">
        <div class="cap"><span>Carta operativa</span><span id="mmRef">—</span></div>
        <canvas id="mini" aria-label="Minimappa"></canvas>
        <button class="mmbig" id="btnMiniBig" aria-label="Ingrandisci la minimappa" aria-pressed="false" title="Ingrandisci la minimappa"></button>
      </div>
      <section class="sel" id="sel"></section>
      <nav class="tabs" id="tabs">
        <button data-act="tab" data-tab="build"><span class="tl">Costruisci</span></button>
        <button data-act="tab" data-tab="prod"><span class="tl" data-s="Produci">Produzione</span></button>
        <button data-act="tab" data-tab="res"><span class="tl">Ricerca</span></button>
        <button data-act="tab" data-tab="des"><span class="tl">Progetta</span></button>
        <button data-act="tab" data-tab="menu" id="btnMenu" aria-label="Menu della partita: pausa, velocità, suono, comandi, uscita"><span class="tl">Menu</span></button>
      </nav>
      <div id="tabbody"></div>
      <div id="drawer" role="region" aria-labelledby="drawTitle">
        <div class="dhead" id="drawHead"><span class="dgrab" aria-hidden="true"></span><h2 class="dtitle" id="drawTitle">Costruisci</h2><span class="dres" title="Gasolio disponibile"><small>Gasolio</small><b id="drawRes">0</b></span><button class="dx" id="drawClose" aria-label="Chiudi il cassetto" title="Chiudi"></button></div>
        <div class="dbody" id="drawBody"><div class="dmenu" id="drawMenu"></div></div>
      </div>
    </aside>
  </div>
</div>
<div id="overlay"></div>

<script>
/*__JS__*/
</script>
